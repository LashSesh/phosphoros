[package]
name = "phosphoros-cli"
version = "1.0.0"
edition = "2021"
authors = ["PHOSPHOROS Project Team"]
description = "TRITON Core CLI - Unified command-line interface for Phosphoros"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LashSesh/phosphoros"

[dependencies]
anyhow = "1"
bip39 = { version = "2", default-features = false, features = ["std", "rand"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ethers-core = "2"
ethers-providers = { version = "2", default-features = false, features = ["legacy-ws"] }
ethers-signers = "2"
hex = "0.4"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
petgraph = "0.6"
