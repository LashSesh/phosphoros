[package]
name = "phosphoros-stealthnet"
version = "0.1.0"
edition = "2021"
authors = ["PHOSPHOROS Project Team"]
description = "Stealth networking and invisible payload layer for PHOSPHOROS - traffic mimicry, steganography, and adaptive API camouflage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LashSesh/phosphoros"
keywords = ["stealth", "network", "privacy", "steganography", "mimicry"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Core dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

# HTTP and networking
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "native-tls"], optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

# Logging
tracing = { version = "0.1", optional = true }

# Encoding
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
network = ["reqwest", "tokio", "tracing"]
