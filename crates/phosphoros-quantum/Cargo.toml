[package]
name = "phosphoros-quantum"
version = "0.1.0"
edition = "2021"
authors = ["PHOSPHOROS Team"]
description = "Quantum computing integration for PHOSPHOROS forensic analysis"
license = "MIT"

[features]
default = ["simulator"]
simulator = []
grover = []
qaoa = []
vqe = []
quantum-walk = []
scs = []
full = ["simulator", "grover", "qaoa", "vqe", "quantum-walk", "scs"]

[dependencies]
# Math & Linear Algebra
nalgebra = "0.33"
num-complex = "0.4"
num-traits = "0.2"

# Random & Probability
rand = "0.8"
rand_distr = "0.4"

# Parallelism
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tokio-test = "0.4"

[[bench]]
name = "quantum_benchmarks"
harness = false
