[workspace]
members = [
    "crates/cryptogenetik-core",
    "crates/phosphoros-bip39",
    "crates/phosphoros-cli",
    "crates/phosphoros-core",
    "crates/phosphoros-dashboard",
    "crates/phosphoros-gateway",
    "crates/phosphoros-monero",
    "crates/phosphoros-quantum",
    "crates/phosphoros-satellite",
    "crates/phosphoros-stealthnet",
    "crates/phosphoros-types",
    "ouroboros_dna",
    "phosphoros-kryptogenetik"
]
resolver = "2"

[workspace.dependencies]
phosphoros-quantum = { path = "crates/phosphoros-quantum" }
phosphoros-types = { path = "crates/phosphoros-types" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
