[package]
name = "phosphoros-kryptogenetik"
version = "1.0.0"
edition = "2021"
authors = ["PHOSPHOROS Project Team"]
description = "Prä-holographisches System zur 5D-Skalarprojektion - Kryptogenetik Core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LashSesh/phosphoros"
keywords = ["blockchain", "forensics", "5d-genetics", "metatron", "triton"]
categories = ["cryptography", "mathematics", "algorithms"]

[dependencies]
# Core Dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
thiserror = "2.0"

# Cryptography & Hashing
sha2 = "0.10"
blake3 = "1.5"

# Optional: für BIP39 Integration
bip39 = { version = "2.0", optional = true }

# Optional: für erweiterte numerische Operationen
nalgebra = { version = "0.32", optional = true }
ndarray = { version = "0.15", optional = true }

# Optional: Parallel processing
rayon = { version = "1.8", optional = true }

[dev-dependencies]
criterion = "0.5"  # Benchmarking
proptest = "1.4"   # Property-based testing

[features]
default = []
bip39-integration = ["bip39"]
advanced-linalg = ["nalgebra", "ndarray"]
parallel = ["rayon"]

[[bench]]
name = "spiral_generation"
harness = false

[[bench]]
name = "metatron_embedding"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
